<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../styles/login_registry_lab.css" />
</head>

<body>
    <h1 style="text-align: center;">Welcome</h1>
    
        <fieldset>
            <h1>Login Page</h1>
            <label>
                <input type="text" name="email" placeholder="Email/Username" /></label><br />
            <label>
                <input type="password" name="password" placeholder="Password" /></label><br />
            <input type="submit" value="Login" />
        </fieldset>
        <fieldset>
            <h1>Register</h1>
            <label>
                <input type="email" name="email" placeholder="Email" /></label><br />
            <label><input type="text" name="username" placeholder="Username" /></label> <br>
            <label><input type="password" name="new_password" placeholder="New Password" /></label><br />
            <label><input type="password" name="confirm_password" placeholder="Confirm Password" /></label> <br>

            <input type="submit" value="Register" />
        </fieldset>
</body>

</html>
